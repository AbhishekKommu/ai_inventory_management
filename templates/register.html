{% extends "base.html" %}

{% block title %}Register | SmartStock AI{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container">
        <div class="auth-logo">
            <i class="fas fa-user-plus"></i>
        </div>
        
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join SmartStock AI today</p>
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <div class="input-icon-wrapper">
                    <input type="text" name="full_name" class="form-control" placeholder="John Doe">
                    <i class="fas fa-id-card input-icon"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Username <span class="required">*</span></label>
                <div class="input-icon-wrapper">
                    <input type="text" name="username" class="form-control" placeholder="johndoe" required minlength="3">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email <span class="required">*</span></label>
                <div class="input-icon-wrapper">
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password <span class="required">*</span></label>
                <div class="input-icon-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password"
                        class="form-control" 
                        placeholder="Min 6 characters"
                        required
                        minlength="6"
                        oninput="checkPasswordStrength(this.value)"
                    >
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                    <div class="strength-bar"></div>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm Password <span class="required">*</span></label>
                <div class="input-icon-wrapper">
                    <input 
                        type="password" 
                        name="confirm_password" 
                        id="confirmPassword"
                        class="form-control" 
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                    >
                    <i class="fas fa-lock input-icon"></i>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-auth">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
