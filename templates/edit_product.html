{% extends "base.html" %}

{% block title %}Edit {{ product.name }} | SmartStock AI{% endblock %}

{% block content %}
<div class="page-header fade-in">
    <div>
        <h1 class="page-title">
            <i class="fas fa-edit"></i> Edit Product
        </h1>
        <p class="page-subtitle">Editing: {{ product.name }} (SKU: {{ product.sku }})</p>
    </div>
    <a href="{{ url_for('products') }}" class="btn btn-outline">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card" style="max-width: 900px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('edit_product', product_id=product.id) }}">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Product Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">SKU (cannot change)</label>
                <input type="text" class="form-control" value="{{ product.sku }}" disabled>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" value="{{ product.category or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Supplier</label>
                <input type="text" name="supplier" class="form-control" value="{{ product.supplier or '' }}">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-textarea">{{ product.description or '' }}</textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Quantity <span class="required">*</span></label>
                <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" min="0" required>
            </div>
            <div class="form-group">
                <label class="form-label">Minimum Stock</label>
                <input type="number" name="min_stock" class="form-control" value="{{ product.min_stock }}" min="0">
            </div>
            <div class="form-group">
                <label class="form-label">Maximum Stock</label>
                <input type="number" name="max_stock" class="form-control" value="{{ product.max_stock }}" min="1">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Selling Price ($)</label>
                <input type="number" name="price" class="form-control" value="{{ product.price }}" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label class="form-label">Cost Price ($)</label>
                <input type="number" name="cost" class="form-control" value="{{ product.cost }}" step="0.01" min="0">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Storage Location</label>
                <input type="text" name="location" class="form-control" value="{{ product.location or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="active" {% if product.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="inactive" {% if product.status == 'inactive' %}selected{% endif %}>Inactive</option>
                    <option value="discontinued" {% if product.status == 'discontinued' %}selected{% endif %}>Discontinued</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Image URL</label>
            <input type="url" name="image_url" class="form-control" value="{{ product.image_url or '' }}">
        </div>
        
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-save"></i> Save Changes
            </button>
            <a href="{{ url_for('products') }}" class="btn btn-outline btn-lg">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
